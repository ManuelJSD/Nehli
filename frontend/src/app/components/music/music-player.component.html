<div class="player-spacer" [hidden]="!selected"></div>
<div class="music-player" [hidden]="!selected" role="region" aria-label="Reproductor de música">
  <div class="playing" *ngIf="track as current">
    <div class="player-art">
      <i class="pi pi-volume-up" aria-hidden="true"></i>
      <img *ngIf="current.artworkId && !artworkFailed" [src]="music.artwork(current.artworkId)" alt="" (error)="artworkFailed = true">
    </div>
    <div class="playing-copy">
      <strong [title]="current.title">{{ current.title }}</strong>
      <small>{{ current.artist }}</small>
    </div>
  </div>

  <div class="transport" *ngIf="selected as queue">
    <div class="transport-buttons">
      <button type="button" class="icon-button" (click)="player.skip(-1)" [disabled]="queue.index === 0" aria-label="Pista anterior">
        <i class="pi pi-step-backward" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-button play-toggle" (click)="togglePlayback()" [attr.aria-label]="playing ? 'Pausar' : 'Reproducir'">
        <i class="pi" [ngClass]="playing ? 'pi-pause' : 'pi-play'" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-button" (click)="player.skip(1)" [disabled]="queue.index + 1 === queue.tracks.length" aria-label="Pista siguiente">
        <i class="pi pi-step-forward" aria-hidden="true"></i>
      </button>
    </div>
    <div class="timeline">
      <span>{{ formatTime(elapsed) }}</span>
      <input type="range" aria-label="Posición de reproducción" min="0" [max]="duration || 1" step="0.1"
             [value]="elapsed" [disabled]="!seekable" [style.--fill]="(duration ? elapsed / duration * 100 : 0) + '%'"
             [attr.aria-valuetext]="formatTime(elapsed)" #progress (input)="seek(progress.value)">
      <span>{{ duration ? formatTime(duration) : '—' }}</span>
    </div>
  </div>

  <div class="player-actions" *ngIf="selected">
    <button type="button" class="icon-button mute" (click)="toggleMute()" [attr.aria-label]="muted ? 'Activar sonido' : 'Silenciar'">
      <i class="pi" [ngClass]="muted || !volume ? 'pi-volume-off' : 'pi-volume-up'" aria-hidden="true"></i>
    </button>
    <input class="volume" type="range" aria-label="Volumen" min="0" max="1" step="0.01" [value]="muted ? 0 : volume"
           [style.--fill]="(muted ? 0 : volume * 100) + '%'" #volumeInput (input)="changeVolume(volumeInput.value)">
    <button type="button" class="icon-button" aria-label="Cola de reproducción" aria-controls="music-queue"
            [attr.aria-expanded]="showQueue" (click)="showQueue = !showQueue">
      <i class="pi pi-list" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-button" (click)="player.close()" aria-label="Cerrar reproductor de música">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>

  <section *ngIf="showQueue && selected as queue" id="music-queue" class="queue-panel" aria-labelledby="music-queue-title">
    <h2 id="music-queue-title">A continuación</h2>
    <p *ngIf="queue.index + 1 === queue.tracks.length">No hay pistas pendientes.</p>
    <ol *ngIf="queue.index + 1 < queue.tracks.length">
      <li *ngFor="let track of queue.tracks | slice:queue.index + 1; let offset = index">
        <div><strong>{{ track.title }}</strong><small>{{ track.artist }}</small></div>
        <button type="button" [attr.aria-label]="'Quitar de la cola: ' + track.title"
                (click)="player.remove(queue.index + offset + 1)">
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
      </li>
    </ol>
  </section>
  <audio #audio hidden preload="none" crossorigin="use-credentials"
         (play)="syncAudio()" (pause)="syncAudio()" (timeupdate)="syncAudio()"
         (loadedmetadata)="syncAudio()" (progress)="syncAudio()" (volumechange)="syncAudio()"
         (ended)="syncAudio(); player.finish()" (error)="onMediaError()"></audio>
  <p *ngIf="error" class="player-error" role="alert">{{ error }}</p>
</div>
