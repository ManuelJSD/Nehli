<a class="anime-card" [href]="data.url" target="_blank" rel="noopener noreferrer"
   [attr.aria-label]="data.titulo + ' · Abrir ficha, nueva pestaña'">
  <img [src]="data.imagen" alt="" class="card-image" loading="lazy" decoding="async" (error)="useFallbackImage($event)">
  <span class="card-body">
    <strong class="card-title" [attr.title]="data.titulo">{{ data.titulo }}<i class="pi pi-external-link" aria-hidden="true"></i></strong>
    <span class="card-meta">
      <span *ngIf="data.episodios as episodes">{{ episodes }} {{ episodes === 1 ? 'episodio' : 'episodios' }}</span>
      <span *ngIf="data.puntuacion"><i class="pi pi-star-fill" aria-hidden="true"></i> {{ data.puntuacion | number:'1.0-2' }}</span>
    </span>
  </span>
</a>
