<div class="anime-page">
  <div class="anime-shell">
    <header class="anime-header"><h1>Anime por género</h1></header>
    <nav class="anime-tabs" aria-label="Explorar anime">
      <a routerLink="/populares" routerLinkActive="current" ariaCurrentWhenActive="page">Populares</a>
      <a routerLink="/temporada" routerLinkActive="current" ariaCurrentWhenActive="page">Temporadas</a>
      <a routerLink="/generos" routerLinkActive="current" ariaCurrentWhenActive="page">Géneros</a>
    </nav>
    <div class="anime-controls">
      <label for="anime-genre">Género</label>
      <select id="anime-genre" [ngModel]="selectedGenero" (ngModelChange)="selectGenre($event)">
        <option *ngFor="let genre of generos" [ngValue]="genre">{{ genre.name }}</option>
      </select>
    </div>
    <p *ngIf="isLoading" role="status" class="anime-status">Cargando anime…</p>
    <div *ngIf="isError" role="alert" class="anime-status">
      <span>No se pudo cargar el listado.</span>
      <button type="button" (click)="load()">Reintentar</button>
    </div>
    <ng-container *ngIf="!isLoading && !isError">
      <p *ngIf="!generosAnime.length" class="anime-status">No hay resultados.</p>
      <div class="anime-grid">
        <app-tarjetas *ngFor="let anime of generosAnime" [data]="{
          imagen: anime.images['jpg'].image_url,
          titulo: anime.title,
          episodios: anime.episodes,
          puntuacion: anime.score,
          url: anime.url
        }"></app-tarjetas>
      </div>
    </ng-container>
    <nav *ngIf="!isLoading && !isError && pageCount > 1" class="pagination" aria-label="Paginación por género">
      <button type="button" [disabled]="paginaActual <= 1" (click)="selectPage(paginaActual - 1)">Anterior</button>
      <span aria-current="page">Página {{ paginaActual }} de {{ pageCount }}</span>
      <button type="button" [disabled]="paginaActual >= pageCount" (click)="selectPage(paginaActual + 1)">Siguiente</button>
    </nav>
  </div>
</div>
