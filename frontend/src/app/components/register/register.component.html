<div class="auth-page">

  <header class="auth-header">
    <a routerLink="/" class="logo-link" aria-label="Volver al inicio">
      <img src="assets/images/logo.webp" alt="Nehli" class="logo">
    </a>
  </header>

  <div class="auth-main">
    <div class="auth-art" aria-hidden="true"></div>
    <div class="auth-card">

      <h1 class="auth-title">Crear cuenta</h1>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="reg-username" class="form-label">
            <i class="pi pi-user" aria-hidden="true"></i>
            Usuario
          </label>
          <input
            id="reg-username"
            type="text"
            placeholder="Elige un nombre de usuario"
            name="username"
            [(ngModel)]="username"
            autocomplete="username"
            [disabled]="isLoading"
            class="form-input">
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label">
            <i class="pi pi-envelope" aria-hidden="true"></i>
            Correo electrónico
          </label>
          <input
            id="reg-email"
            type="email"
            placeholder="tucorreo@ejemplo.com"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            [disabled]="isLoading"
            class="form-input">
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">
            <i class="pi pi-lock" aria-hidden="true"></i>
            Contraseña
          </label>
          <input
            id="reg-password"
            type="password"
            placeholder="Mínimo 4 caracteres"
            name="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            [disabled]="isLoading"
            class="form-input">
        </div>

        <div class="form-group">
          <label for="reg-password-confirmation" class="form-label">Confirmar contraseña</label>
          <input id="reg-password-confirmation" type="password" name="passwordConfirmation"
                 [(ngModel)]="passwordConfirmation" autocomplete="new-password"
                 [disabled]="isLoading" class="form-input">
        </div>

        <div class="form-group">
          <label for="reg-challenge" class="form-label">Escribe los cinco dígitos de la imagen</label>
          <img *ngIf="challenge" [src]="challenge.image" width="144" height="50" alt="Código visual de verificación">
          <p *ngIf="challengeError" role="alert">{{ challengeError }}</p>
          <button type="button" class="footer-link challenge-refresh"
                  [disabled]="isLoading || loadingChallenge" (click)="refreshChallenge()">Generar otro código</button>
          <input id="reg-challenge" type="text" inputmode="numeric" autocomplete="off"
                 maxlength="5" name="challengeAnswer" [(ngModel)]="challengeAnswer"
                 [disabled]="isLoading || !challenge" class="form-input">
        </div>

        <div *ngIf="errorMessage" class="error-banner" role="alert">
          <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <button
          pButton
          type="submit"
          [label]="isLoading ? 'Creando cuenta...' : 'Crear cuenta'"
          [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-user-plus'"
          [disabled]="isLoading || !username || !password || !passwordConfirmation || !email || !challenge || !challengeAnswer"
          class="btn-submit">
        </button>
      </form>

      <div class="auth-footer">
        <span class="footer-text">¿Ya tienes cuenta?</span>
        <a routerLink="/login" class="footer-link">Iniciar sesión</a>
      </div>
    </div>
  </div>
</div>
