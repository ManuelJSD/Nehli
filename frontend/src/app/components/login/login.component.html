<div class="auth-page">

  <header class="auth-header">
    <a routerLink="/" class="logo-link" aria-label="Volver al inicio">
      <img src="assets/images/logo.webp" alt="Nehli" class="logo">
    </a>
  </header>

  <div class="auth-main">
    <div class="auth-art" aria-hidden="true"></div>
    <div class="auth-card">

      <h1 class="auth-title">Iniciar sesión</h1>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="login-username" class="form-label">
            <i class="pi pi-user" aria-hidden="true"></i>
            Usuario
          </label>
          <input
            id="login-username"
            type="text"
            placeholder="Tu nombre de usuario"
            name="username"
            [(ngModel)]="username"
            autocomplete="username"
            [disabled]="isLoading"
            class="form-input">
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">
            <i class="pi pi-lock" aria-hidden="true"></i>
            Contraseña
          </label>
          <input
            id="login-password"
            type="password"
            placeholder="Tu contraseña"
            name="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            [disabled]="isLoading"
            class="form-input">
        </div>

        <div *ngIf="loginError" class="error-banner" role="alert">
          <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <button
          pButton
          type="submit"
          [label]="isLoading ? 'Entrando...' : 'Iniciar sesión'"
          [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-sign-in'"
          [disabled]="isLoading || !username || !password"
          class="btn-submit">
        </button>
      </form>

      <div class="auth-footer">
        <a routerLink="/recuperar" class="footer-link">¿Olvidaste tu contraseña?</a>

      </div>
    </div>
  </div>
</div>
