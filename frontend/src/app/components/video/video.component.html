<div class="commercial-layout">



  <!-- Hero Section: El reproductor domina toda la parte superior -->
  <div class="player-hero">
    <video id="my-video" class="video-js vjs-fluid" crossorigin="anonymous" playsinline></video>
  </div>

  <!-- Contenedor de Detalles (Bajo el reproductor) -->
  <div class="media-container">
    
    <!-- Metadatos y Acciones -->
    <div class="media-header">
      <div class="title-block">
        <h1 class="media-title">{{ subcategory || category }}</h1>
        <h3 class="media-episode" *ngIf="video">{{ video }}</h3>
      </div>
      
      <div class="track-controls">
        <div class="track-control" *ngIf="audios.length > 1">
          <label for="audioSelect">Audio</label>
          <p-dropdown
            inputId="audioSelect"
            [options]="audios"
            [ngModel]="currentAudioIndex"
            optionLabel="title"
            optionValue="index"
            appendTo="body"
            (onChange)="cambiarAudio($event)">
            <ng-template let-audio pTemplate="item">
              <div class="audio-item">
                <span>{{ audio.title }}</span>
                <small *ngIf="audio.language !== 'und'">{{ audio.language | uppercase }}</small>
              </div>
            </ng-template>
          </p-dropdown>
        </div>
        <div class="track-control" *ngIf="subtitles.length">
          <label for="subtitleSelect">Subtítulos</label>
          <p-dropdown
            inputId="subtitleSelect"
            [options]="subtitleOptions"
            [ngModel]="currentSubtitleIndex"
            optionLabel="title"
            optionValue="index"
            appendTo="body"
            (onChange)="cambiarSubtitulo($event)">
          </p-dropdown>
        </div>
      </div>
    </div>

    <p role="alert" *ngIf="playbackError">{{ playbackError }}</p>
    <p role="status" *ngIf="subtitleStatus">{{ subtitleStatus }}</p>

    <!-- Sección de Episodios (Full width, lista limpia) -->
    <div class="episodes-section">
      <div class="section-title">
        <h2>Episodios</h2>
        <div class="divider"></div>
      </div>
      
      <div class="tree-container-commercial">
        <p-tree 
          [value]="filesTree" 
          selectionMode="single" 
          [(selection)]="selectedNode"
          (onNodeSelect)="seleccionarCapitulo($event)"
          [filter]="true" 
          filterPlaceholder="Buscar episodio...">
        </p-tree>
      </div>
    </div>

  </div>
</div>
